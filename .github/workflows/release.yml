name: Release - build & push Docker image

# Publishing a GitHub Release (with a version tag like `v1.2.3`) builds the single
# Docker image and pushes it to the GitHub Container Registry (ghcr.io) with
# semver + `latest` tags.
#
#   GitHub → Releases → Draft a new release → tag `v1.2.3` → Publish
#   (or: gh release create v1.2.3 --generate-notes)
#
# Nothing to configure: it authenticates with the built-in GITHUB_TOKEN.
on:
  release:
    types: [published] # fires when a GitHub Release is published
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name (ghcr.io, lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # From tag v1.2.3 → 1.2.3, 1.2, 1, plus a short-sha tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          # `latest` is applied automatically to the newest non-prerelease tag.
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Drop linux/arm64 if you only need amd64 (it roughly halves build time).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "### Pushed \`${{ steps.image.outputs.name }}\`"
            echo ""
            echo "**Tags**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
